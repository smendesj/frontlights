<!--
  Modelo de seção do artefato (references/grilling.md, "The artifact"), que `frontlights.py artifact section` monta
  dos campos ## <campo> do arquivo de conteúdo. A seção explica mais que a pergunta e nunca repete a pergunta.
  Visual, Cenário por opção e Consequências estão em toda seção; os outros campos, vazios, são omitidos.
  Tela: o print da base e o mesmo print da base com as marcas de cada opção (posição por regra de CSS, pelo id).
  Rótulos "Base" e "Com a opção", nunca antes/depois. Código real até 15 linhas, com o caminho, segredos como ***;
  dado real nunca, nem no print.
-->
<section class="secao" id="secao-<n>">
  <h2 class="secao-titulo">Seção <n>: <pergunta></h2>
  <div class="campo campo-por-que">
    <h3>Por que estamos perguntando isso</h3>
    <p><o que depende desta resposta></p>
  </div>
  <div class="campo campo-visual">
    <h3>Visual</h3>
    <div class="comparacao">
      <figure class="base">
        <figcaption>Base</figcaption>
        <img class="print" src="antes.png" alt="<o print da base>">
      </figure>
      <figure class="com-opcao">
        <figcaption>Com a opção: <opção></figcaption>
        <div class="print-marcado">
          <img class="print" src="antes.png" alt="<o mesmo print da base>">
          <p class="marca marca-texto" id="marca-<n>-1"><o que a opção muda aqui></p>
        </div>
      </figure>
    </div>
  </div>
  <div class="campo campo-cenario">
    <h3>Cenário por opção</h3>
    <ul class="opcoes"><li><strong><opção></strong>: <um caso com dados inventados></li></ul>
  </div>
  <div class="campo campo-consequencias">
    <h3>Consequências</h3>
    <ul class="opcoes"><li><strong><opção></strong>: <custo de errar, volta atrás, o que impede></li></ul>
  </div>
  <div class="campo campo-conceitos">
    <h3>Conceitos</h3>
    <p><termo em palavras simples></p>
  </div>
  <div class="campo campo-projeto">
    <h3>Onde o projeto já faz</h3>
    <pre class="codigo"><code><caminho:linha e trecho real, até 15 linhas></code></pre>
  </div>
  <div class="campo campo-recomendacao">
    <h3>Recomendação (opinião)</h3>
    <p><a opção recomendada e o motivo></p>
  </div>
  <div class="campo campo-escolha">
    <h3>Escolha</h3>
    <p><registrada por artifact choose></p>
  </div>
</section>
