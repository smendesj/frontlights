name: Testes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  helpers:
    strategy:
      matrix:
        os: [windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q skills/frontlights/scripts tests
      - run: python skills/frontlights/scripts/frontlights.py validate-plan --plan skills/frontlights/examples/plan.json
      - run: python skills/frontlights/scripts/frontlights.py schedule --plan skills/frontlights/examples/plan.json --limit 2
